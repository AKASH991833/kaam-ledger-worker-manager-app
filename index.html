'use strict';
const KEY='kaamledger.v1', DEMOKEY='kaamledger.demo.v1';const TYPES=[['Absent',0],['Half',.5],['Single',1],['Dedh',1.5],['Double',2]];let loadError=false;let demo=false,page='overview',query='',month=today().slice(0,7),attDate=today(),selectedWorker='',txType='all',showArchived=false,draft={},state=load(KEY);let storageOkay=true;
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function blank(){return {version:1,business:'My workspace',workers:[],attendance:[],transactions:[]}}
function load(k){try{let x=localStorage.getItem(k);if(!x)return blank();let s=JSON.parse(x);validate(s);return s}catch(e){loadError=true;window.setTimeout(()=>toast('Stored data could not be read. Restore a valid backup in Settings.'),1000);return blank()}}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(n/100)}function dateLabel(d){return new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}function monthLabel(m){return new Date(m+'-01T12:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'})}function cents(v){let n=Number(v);if(!Number.isFinite(n)||n<0||n>10000000)throw Error('Enter a valid amount between 0 and 1 crore.');return Math.round(n*100)}
function validDate(d){return typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&new Date(d+'T12:00:00').toISOString().slice(0,10)===d}function validate(s){if(!s||s.version!==1||typeof s.business!=='string'||s.business.length>100||!['workers','attendance','transactions'].every(k=>Array.isArray(s[k]))||s.workers.length>10000||s.attendance.length+s.transactions.length>200000)throw Error('Unsupported or invalid backup.');let ids=new Set;for(let w of s.workers){if(typeof w.id!=='string'||!/^[-a-zA-Z0-9]{1,100}$/.test(w.id)||ids.has(w.id)||typeof w.name!=='string'||!w.name.trim()||w.name.length>100||typeof w.phone!=='string'||typeof w.address!=='string'||w.address.length>500||!Number.isSafeInteger(w.rate)||w.rate<0||w.rate>1e9||typeof w.archived!=='boolean')throw Error('Invalid worker record.');ids.add(w.id)}let seen=new Set,all=new Set;for(let a of s.attendance){if(!ids.has(a.worker)||!validDate(a.date)||!TYPES.some(t=>t[1]===a.units)||!Number.isSafeInteger(a.rate)||a.rate<0||a.rate>1e9||typeof a.id!=='string'||!/^[-a-zA-Z0-9]{1,100}$/.test(a.id)||all.has(a.id)||seen.has(a.worker+a.date))throw Error('Invalid or duplicate attendance.');all.add(a.id);seen.add(a.worker+a.date)}let ti=new Set;for(let t of s.transactions){if(!ids.has(t.worker)||!validDate(t.date)||!['advance','payment','travel','reimbursement'].includes(t.kind)||!Number.isSafeInteger(t.amount)||t.amount<=0||t.amount>1e9||typeof t.id!=='string'||!/^[-a-zA-Z0-9]{1,100}$/.test(t.id)||ti.has(t.id)||typeof t.note!=='string'||t.note.length>500)throw Error('Invalid payment or travel entry.');ti.add(t.id)}for(let t of s.transactions.filter(t=>t.kind==='reimbursement')){let tr=s.transactions.find(x=>x.id===t.travel&&x.kind==='travel'&&x.worker===t.worker);if(!tr||t.date<tr.date)throw Error('Invalid travel reimbursement.')}for(let t of s.transactions.filter(t=>t.kind==='travel'))if(s.transactions.filter(x=>x.travel===t.id&&x.kind==='reimbursement').reduce((n,x)=>n+x.amount,0)>t.amount)throw Error('Travel is reimbursed function commit(next=state,recovery=false){try{if(loadError&&!recovery)throw Error("Stored data needs recovery. Restore a backup or explicitly reset in Settings.");validate(next);localStorage.setItem(demo?DEMOKEY:KEY,JSON.stringify(next));state=next;storageOkay=true;loadError=false;return true}catch(e){storageOkay=false;toast('Not saved: '+e.message+' Download a backup before closing.');return false}}function change(fn){let s=structuredClone(state);fn(s);return commit(s)}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(t.timer);t.timer=setTimeout(()=>t.hidden=true,4500)}
function worker(id){return state.workers.find(w=>w.id===id)}function attAmount(a){return Math.round(a.rate*a.units)}function tally(id,from='',to='9999-12-31'){let a=state.attendance.filter(x=>(!id||x.worker===id)&&x.date>=from&&x.date<=to),t=state.transactions.filter(x=>(!id||x.worker===id)&&x.date>=from&&x.date<=to);let total=k=>t.filter(x=>x.kind===k).reduce((s,x)=>s+x.amount,0),earned=a.reduce((s,x)=>s+attAmount(x),0),advance=total('advance'),paid=total('payment'),travel=total('travel'),reimbursed=total('reimbursement');return {earned,advance,paid,travel,reimbursed,wageBalance:earned-advance-paid,travelBalance:travel-reimbursed,balance:earned+travel-advance-paid-reimbursed,units:a.reduce((s,x)=>s+x.units,0),days:a.filter(x=>x.units>0).length,marked:a.length}}
function monthRange(m){let [y,mo]=m.split('-').map(Number);let end=new Date(y,mo,0);return [m+'-01',m+'-'+end.getDate()]}function prior(m){let d=new Date(m+'-01T12:00:00');d.setDate(0);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const NAV=[['overview','◈','Overview'],['workers','♙','Workers'],['attendance','▦','Attendance'],['payments','↗','Payments'],['statements','▤','Hisaab'],['settings','⚙','Settings']];function navigate(p){if(Object.keys(draft).length&&!confirm('Discard unsaved attendance changes?'))return;page=p;query='';draft={};render();window.scrollTo(0,0)}

function head(title,desc,buttons=''){return `<div class="pagehead"><div><h1>${title}</h1><p class="muted">${desc}</p></div><div class="actions">${buttons}</div></div>`}function empty(title,text,action=''){return `<div class="empty"><div class="emoji">◈</div><h2>${title}</h2><p>${text}</p>${action}</div>`}function stat(l,v,sub='',cl=''){return `<div class="stat"><label>${l}</label><strong class="${cl}">${v}</strong><small>${sub}</small></div>`}function monthInput(){return `<div><label for="month">Hisaab month</label><input id="month" type="month" value="${month}" required></div>`}function workersOptions(allowAll=false){return `${allowAll?'<option value="">All workers</option>':''}`+state.workers.map(w=>`<option value="${w.id}" ${w.id===selectedWorker?'selected':''}>${esc(w.name)}${w.archived?' (archived)':''}</option>`).join('')}function workerPick(all=false){return `<div><label for="workerSelect">Worker</label><select id="workerSelect">${workersOptions(all)}</select></div>`}
function overview(){let all=tally(),[f,t]=monthRange(month),m=tally('',f,t),pending=state.workers.map(w=>({w,s:tally(w.id)})).filter(x=>x.s.balance!==0).sort((a,b)=>b.s.balance-a.s.balance);return head('Worker hisaab, sorted.','Daily kaam se final payment tak. Sab ek jagah.',`<button class="primary" data-action="add-worker">+ Add worker</button>`)+`<div class="hero"><div><span class="pill">${demo?'FICTIONAL DEMO WORKSPACE':'YOUR DAILY WORKFLOW'}</span><h2 style="margin-top:12px">Kaam mark karo. Hisaab clear rakho.</h2><p>Attendance → advance / payment → worker statement</p></div><div class="actions"><button class="primary" data-page="attendance">Mark attendance ↗</button><button class="primary" data-action="advance">+ Advance</button></div></div><div class="stats">${stat('Active workers',state.workers.filter(w=>!w.archived).length,'Archive workers without losing history')}${stat('Wage balance',money(all.wageBalance),'All-time earned − advance − wage paid','accent')}${stat('Travel pending',money(all.travelBalance),'Worker-paid fare − reimbursements','green')}${stat('Combined balance',money(all.balance),all.balance<0?'Negative = owner has paid extra':'Wages + pending travel','accent')}</div><div class="two"><div class="card"><div class="row between"><h2>This month</h2><input id="month" type="month" value="${month}" style="width:155px"></div><p class="muted small" style="margin-top:8px">${monthLabel(month)} · activity only, not opening balance</p><div class="monthsummary" style="grid-template-columns:repeat(2,1fr)"><div><span class="muted small">Work units</span><strong>${m.units} days</strong></div><div><span class="muted small">Wages earned</span><strong>${money(m.earned)}</strong></div><div><span class="muted small">Advance given</span><strong>${money(m.advance)}</strong></div><div><span class="muted small">Wages paid</span><strong>${money(m.paid)}</strong></div></div><div class="note">₹500 rate × 1.5 days = ₹750. Advances are money already given, not extra wages.</div></div><div class="card"><h2>Balances to review</h2><p class="muted small" style="margin-top:7px">Includes every month. Negative is extra paid.</p>${pending.length?pending.slice(0,5).map(({w,s})=>`<div class="entry row between"><div class="row"><div class="avatar">${esc(w.name[0].toUpperCase())}</div><div><strong>${esc(w.name)}</strong><div class="muted small">${w.archived?'Archived · ':''}${s.units} work units</div></div></div><button class="quiet" data-statement="${w.id}">${money(s.balance)} ↗</button></div>`).join(''):empty('A clean slate','Add your first worker, then start marking daily work.',`<button data-action="add-worker">+ Add worker</button>`)}</div></div>${!state.workers.length?`<div class="note no-print">Want to try first? <button class="quiet" data-action="demo">Explore fictional demo</button> Demo stays separate from your real workspace.</div>`:''}`}
function workers(){let list=state.workers.filter(w=>(showArchived||!w.archived)&&[w.name,w.phone,w.address].join(' ').toLowerCase().includes(query.toLowerCase()));return head('Your workers','Naam, number, rate aur poora payment history.',`<button class="primary" data-action="add-worker">+ Add worker</button>`)+`<div class="toolbar"><div><label for="search">Find a worker</label><input id="search" placeholder="Search name, mobile or address" value="${esc(query)}"></div><button id="archiveToggle" class="${showArchived?'primary':''}">${showArchived?'Hide archived':'Show archived'}</button></div><div class="three">${list.map(w=>{let s=tally(w.id);return `<div class="card worker" data-worker-card="${w.id}" tabindex="0" role="group" aria-label="Open ${esc(w.name)} details"><div class="row"><div class="avatar">${esc(w.name[0].toUpperCase())}</div><div><h3>${esc(w.name)}</h3><span class="muted small">${esc(w.phone||'No mobile added')} ${w.archived?'· Archived':''}</span></div></div><p class="muted small" style="margin-top:13px">${esc(w.address||'No address added')}</p><div class="divider"></div><div class="row between"><span class="muted">Daily rate</span><strong>${money(w.rate)}</strong></div><div class="balance"><span class="muted">Total balance<br><small>Wages + travel</small></span><strong class="accent">${money(s.balance)}</strong></div><div class="actions"><button class="primary" data-detail="${w.id}">Full details ↗</button><button data-advance="${w.id}">+ Advance</button><button data-edit-worker="${w.id}">Edit</button></div></div>`}).join('')}</div>${!list.length?`<div class="card">${empty(state.workers.length?'No matching workers':'Start with your first worker','Add name and daily rate. Mobile and address are optional.',`<button class="primary" data-action="add-worker">+ Add worker</button>`)}</div>`:''}`}
function openWorkerDetail(id){selectedWorker=id;detailMonth='';detailType='all';navigate('detail')}
function workerHistory(id){let rows=[...state.attendance.filter(a=>a.worker===id).map(a=>({id:a.id,date:a.date,type:'attendance',label:TYPES.find(t=>t[1]===a.units)[0],units:a.units,rate:a.rate,earned:attAmount(a),advance:0,paid:0,travel:0,repaid:0,note:''})),...state.transactions.filter(t=>t.worker===id).map(t=>({id:t.id,date:t.date,type:t.kind,label:kindLabel(t.kind),units:'',rate:'',earned:0,advance:t.kind==='advance'?t.amount:0,paid:t.kind==='payment'?t.amount:0,travel:t.kind==='travel'?t.amount:0,repaid:t.kind==='reimbursement'?t.amount:0,note:t.note}))].sort((a,b)=>a.date.localeCompare(b.date)||(a.type==='attendance'?-1:1)-(b.type==='attendance'?-1:1)||a.id.localeCompare(b.id));let balance=0;return rows.map(r=>({...r,balance:balance+=r.earned+r.travel-r.advance-r.paid-r.repaid}))}
function workerDetail(){let w=worker(selectedWorker);if(!w)return head('Worker not found','Open Workers and select a worker.');let total=tally(w.id),all=workerHistory(w.id),rows=all.filter(r=>(!detailMonth||r.date.startsWith(detailMonth))&&(detailType==='all'||r.type===detailType));return head(w.name,'Poora worker record · all months by default',`<button data-page="workers">← Workers</button>`)+`<div class="card"><div class="detail-profile"><div><span class="muted small">Mobile</span><p>${esc(w.phone||'Not added')}</p></div><div><span class="muted small">Address</span><p>${esc(w.address||'Not added')}</p></div><div><span class="muted small">Current daily rate</span><p>${money(w.rate)}</p></div><div><span class="muted small">Status</span><p>${w.archived?'Archived':'Active'}</p></div></div><div class="detail-actions"><button class="primary" data-advance="${w.id}">+ Advance do</button><button data-action="add-tx">+ Payment / travel</button><button data-edit-worker="${w.id}">Edit worker</button><button data-statement="${w.id}">Monthly statement / exports</button></div><div class="note">Advance likhne ke liye <strong>+ Advance do</strong> tap karo. Worker pehle se selected hoga. Date, amount aur note likho, phir Save entry.</div></div><div class="stats detail-summary" style="margin-top:18px">${stat('Total wages earned',money(total.earned),'All months')}${stat('Total advance given',money(total.advance),'Money already given')}${stat('Wages paid',money(total.paid),'Separate from advance')}${stat('Total balance',money(total.balance),'Wages + travel − all money given','accent')}</div><div class="card"><h2>Full history · rows & columns</h2><p class="muted small" style="margin-top:8px">${all.length} total records · ${rows.length} shown. ${total.units} work units. Travel pending ${money(total.travelBalance)}.</p><div class="toolbar" style="margin-top:18px"><div><label for="detailMonth">Month (blank = all months)</label><input type="month" id="detailMonth" value="${detailMonth}"></div><div><label for="detailType">Records</label><select id="detailType">${[['all','All records'],['attendance','Attendance'],['advance','Advances'],['payment','Wage payments'],['travel','Travel costs'],['reimbursement','Travel repayments']].map(([v,l])=>`<option value="${v}" ${v===detailType?'selected':''}>${l}</option>`).join('')}</select></div><button id="allHistory">All history</button></div><p class="muted small" style="margin-bottom:10px">Swipe sideways for all columns ↔ Date stays fixed. Running balance includes earlier and hidden entries, not just filtered rows.</p><div class="tablewrap"><table class="ledger-table"><thead><tr>${['Date','Entry','Day units','Saved rate','Earned','Advance','Wages paid','Travel cost','Travel repaid','Running balance','Note'].map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td>${dateLabel(r.date)}</td><td>${esc(r.label)}</td><td>${r.units}</td><td>${r.rate===''?'':money(r.rate)}</td><td>${money(r.earned)}</td><td>${money(r.advance)}</td><td>${money(r.paid)}</td><td>${money(r.travel)}</td><td>${money(r.repaid)}</td><td>${money(r.balance)}</td><td>${esc(r.note)}</td></tr>`).join('')||'<tr><td colspan="11">No records in this view. Use All history or record attendance and money.</td></tr>'}</tbody></table></div></div>`}
function attendance(){let list=state.workers.filter(w=>!w.archived&&[w.name,w.phone].join(' ').toLowerCase().includes(query.toLowerCase()));return head('Daily attendance','Half, single, dedh ya double. Payment automatically calculate hoga.',`<button class="primary" data-action="save-attendance">Save day</button>`)+`<div class="toolbar"><div><label for="attDate">Work date</label><input id="attDate" type="date" value="${attDate}" max="${today()}"></div><div><label for="search">Find worker</label><input id="search" placeholder="Name or mobile" value="${esc(query)}"></div></div><div class="note">Absent = 0 · Half = 0.5× · Single = 1× · Dedh = 1.5× · Double = 2×<br>Unmarked does not mean absent. Select a status, then save. Existing entries keep their original rate.</div><div class="card">${list.length?list.map(w=>{let saved=state.attendance.find(a=>a.worker===w.id&&a.date===attDate),units=draft[w.id]==='unmark'?undefined:(draft[w.id]??saved?.units),rate=saved?.rate??w.rate;return `<div class="attendance-row"><div class="row"><div class="avatar">${esc(w.name[0].toUpperCase())}</div><div><strong>${esc(w.name)}</strong><div class="muted small">${money(rate)} / day ${saved?'· Saved rate':''}</div></div></div><div class="choices">${TYPES.map(([l,v])=>`<button class="${units===v?'selected':''}" data-att="${w.id}" data-units="${v}" aria-pressed="${units===v}">${l}<br><span class="small">${v}×</span></button>`).join('')}<button data-att="${w.id}" data-units="unmark" aria-label="Remove attendance for ${esc(w.name)}">Clear</button></div><strong class="${units!==undefined?'accent':'muted'}">${units===undefined?'Unmarked':money(Math.round(rate*units))}</strong></div>`}).join(''):empty('No active workers','Add a worker before marking daily attendance.',`<button data-action="add-worker">+ Add worker</button>`)}</div><p class="muted small" style="margin-top:15px">One saved record per worker per day. Correct a status here and save again. Clear removes that day's entry after saving.</p>`}
function payments(){let list=state.transactions.filter(t=>(!selectedWorker||t.worker===selectedWorker)&&t.date.startsWith(month)&&(txType==='all'||t.kind===txType)).sort((a,b)=>b.date.localeCompare(a.date));return head('Payments & travel','Advance, wage settlement aur bhada ko alag rakho.',`<button class="primary" data-action="advance">+ Advance</button><button data-action="add-tx">+ Payment / travel</button>`)+`<div class="toolbar">${monthInput()}${workerPick(true)}<div><label for="txType">Entry type</label><select id="txType">${[['all','All entries'],['advance','Advance'],['payment','Wage payment'],['travel','Travel cost'],['reimbursement','Travel reimbursement']].map(([v,l])=>`<option value="${v}" ${v===txType?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="two"><div class="card"><h2>Money entries</h2><p class="muted small" style="margin:6px 0 15px">${list.length} entries · ${monthLabel(month)}</p>${list.length?list.map(t=>`<div class="entry"><div class="row between"><div><span class="tag">${kindLabel(t.kind)}</span><h3>${esc(worker(t.worker)?.name)}</h3><p class="muted small">${dateLabel(t.date)}${t.note?' · '+esc(t.note):''}</p></div><strong class="${t.kind==='travel'?'green':'accent'}">${money(t.amount)}</strong></div><div class="actions" style="margin-top:9px"><button class="quiet small" data-edit-tx="${t.id}">Edit</button><button class="quiet small danger" data-delete-tx="${t.id}">Delete</button></div></div>`).join(''):empty('No entries in this view','Record money given to a worker or a travel cost they paid.',`<button data-action="add-tx">+ Add entry</button>`)}</div><div class="card"><h2>Travel waiting to be repaid</h2><p class="muted small" style="margin-top:6px">All-time pending, not limited to selected month.</p>${pendingTravel(selectedWorker).map(t=>`<div class="entry"><div class="row between"><div><strong>${esc(worker(t.worker)?.name)}</strong><p class="muted small">${dateLabel(t.date)} · ${esc(t.note||'Travel fare')}</p></div><strong class="green">${money(travelRemaining(t.id))}</strong></div><button style="margin-top:10px" data-reimburse="${t.id}">Reimburse travel</button></div>`).join('')||empty('Travel is clear','Worker-paid fare appears here until the owner reimburses it.')}<div class="note">An advance or wage payment never auto-clears travel. Record a separate travel reimbursement.</div></div></div>`}
function kindLabel(k){return {advance:'Advance given',payment:'Wage payment',travel:'Worker-paid travel',reimbursement:'Travel reimbursed'}[k]}function travelRemaining(id,exclude=''){let t=state.transactions.find(t=>t.id===id);return (t?.amount||0)-state.transactions.filter(t=>t.kind==='reimbursement'&&t.travel===id&&t.id!==exclude).reduce((s,t)=>s+t.amount,0)}function pendingTravel(id=''){return state.transactions.filter(t=>t.kind==='travel'&&(!id||t.worker===id)&&travelRemaining(t.id)>0).sort((a,b)=>a.date.localeCompare(b.date))}
function statementData(){let w=worker(selectedWorker);if(!w)return null;let [f,t]=monthRange(month),opening=tally(w.id,'',prior(month)),m=tally(w.id,f,t),end=tally(w.id,'',t);let rows=[...state.attendance.filter(a=>a.worker===w.id&&a.date>=f&&a.date<=t).map(a=>({date:a.date,type:TYPES.find(x=>x[1]===a.units)[0]+' attendance',units:a.units,rate:a.rate,earned:attAmount(a),travel:0,given:0,note:''})),...state.transactions.filter(x=>x.worker===w.id&&x.date>=f&&x.date<=t).map(x=>({date:x.date,type:kindLabel(x.kind),units:'',rate:'',earned:0,travel:x.kind==='travel'?x.amount:0,given:x.kind==='travel'?0:x.amount,note:x.note}))].sort((a,b)=>a.date.localeCompare(b.date)||a.type.localeCompare(b.type));return {w,opening,m,end,rows}}
function statements(){if(!worker(selectedWorker))selectedWorker=state.workers[0]?.id||'';let d=statementData();return head('Worker statement','Month-wise kaam, advance, travel aur clear balance.',`<button data-action="share" class="primary" ${!d?'disabled':''}>Share ↗</button>`)+`<div class="toolbar">${workerPick()}${monthInput()}<div class="actions no-print"><button data-action="excel" ${!d?'disabled':''}>Excel ↓</button><button data-action="csv" ${!d?'disabled':''}>CSV ↓</button><button data-action="print" ${!d?'disabled':''}>Print / PDF</button></div></div>${!d?`<div class="card">${empty('No worker statement yet','Add a worker and their daily work to create a month-wise hisaab.',`<button data-action="add-worker">+ Add worker</button>`)}</div>`:`<div class="card" id="statement"><div class="statementhead"><div><span class="accent small">KAAMLEDGER · ${demo?'FICTIONAL DEMO':'WORKER STATEMENT'}</span><h2 style="margin:7px 0">${esc(d.w.name)}</h2><p class="muted small">${esc(d.w.phone||'')} ${d.w.address?(d.w.phone?'· ':'')+esc(d.w.address):''}</p></div><div><strong>${monthLabel(month)}</strong><p class="muted small">${esc(state.business)}<br>Generated ${dateLabel(today())}</p></div></div><div class="monthsummary"><div><span class="muted small">Opening balance</span><strong>${money(d.opening.balance)}</strong></div><div><span class="muted small">Work units</span><strong>${d.m.units} days</strong></div><div><span class="muted small">Wages earned</span><strong>${money(d.m.earned)}</strong></div><div><span class="muted small">Advance given</span><strong>${money(d.m.advance)}</strong></div><div><span class="muted small">Wages paid</span><strong>${money(d.m.paid)}</strong></div></div><div class="row between"><div><h3>Closing balance</h3><p class="muted small">As of ${dateLabel(monthRange(month)[1])}</p></div><h2 class="accent">${money(d.end.balance)}</h2></div><div class="divider"></div><div class="two" style="gap:10px"><p class="muted small">Wage balance: <strong>${money(d.end.wageBalance)}</strong><br>Travel still pending: <strong>${money(d.end.travelBalance)}</strong></p><p class="muted small">This month travel cost: ${money(d.m.travel)}<br>This month travel reimbursed: ${money(d.m.reimbursed)}</p></div><div class="note">Opening + wages + worker-paid travel − advance − wage payments − travel reimbursements = closing balance.<br>Positive = owner owes worker. Negative = owner has paid extra. Unmarked dates are not counted as absent.</div><p class="muted small no-print" style="margin:14px 0 8px">Swipe the table sideways to see all columns ↔</p><div class="tablewrap"><table><thead><tr><th>Date</th><th>Entry</th><th>Work units</th><th>Rate</th><th>Wages earned</th><th>Travel cost</th><th>Money given</th><th>Note</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td>${dateLabel(r.date)}</td><td>${esc(r.type)}</td><td>${r.units}</td><td>${r.rate===''?'':money(r.rate)}</td><td>${r.earned?money(r.earned):'₹0'}</td><td>${r.travel?money(r.travel):'₹0'}</td><td>${r.given?money(r.given):'₹0'}</td><td>${esc(r.note)}</td></tr>`).join('')||'<tr><td colspan="8">No activity this month. Opening balance carries forward.</td></tr>'}</tbody></table></div><p class="muted small" style="margin-top:13px">${d.m.marked} marked dates · ${d.m.days} dates worked · Historical rates are preserved. This is a ledger statement, not proof of bank payment.</p></div>`}`}
function settings(){return head('Workspace settings','Your data stays here. Keep a backup somewhere safe.')+`<div class="two"><div class="stack"><div class="card"><h2>Business name</h2><label for="business">Shown on worker statements</label><input id="business" maxlength="100" value="${esc(state.business)}"><button class="primary" data-action="save-business" style="margin-top:14px">Save name</button></div><div class="card"><h2>Backup & restore</h2><p class="muted" style="margin-top:10px">Browser data can be lost if you clear storage, switch devices or use private browsing. Download a JSON backup after important updates.</p><div class="settings-actions"><button class="primary" data-action="backup">Download backup ↓</button><button data-action="restore">Restore backup ↑</button><input id="restoreFile" type="file" accept=".json,application/json" hidden></div><p class="muted small" style="margin-top:14px">Restore replaces this workspace after confirmation. Export your current backup first. Backups contain private worker details; never publish them on GitHub.</p></div><div class="card"><h2>Try without real data</h2><p class="muted" style="margin-top:10px">Fictional demo has a separate storage space. Your real ledger is not changed.</p><div class="settings-actions"><button data-action="demo">${demo?'Exit demo to real workspace':'Explore demo workspace'}</button><button class="danger quiet" data-action="reset">Reset ${demo?'demo':'workspace'}</button></div></div></div><div class="card help"><h2>Simple guide</h2><ol><li><strong>Add workers.</strong> Set each person's daily rate, name and contact details.</li><li><strong>Mark daily work.</strong> Pick date, choose status and tap Save day. ₹500 × 1.5 = ₹750.</li><li><strong>Record money.</strong> Advance is money given early. Wage payment is a later settlement. Both reduce wage balance.</li><li><strong>Track travel.</strong> Record fare the worker paid. Use Reimburse travel when the owner repays it, fully or partly.</li><li><strong>Review Hisaab.</strong> Choose worker and month. Opening balance carries older dues. Share the text, print to PDF, or download formatted Excel.</li><li><strong>Back up.</strong> Download JSON before clearing your browser or moving to another phone.</li></ol><div class="note">No login, server sync, automatic salary transfer, WhatsApp bot or multi-device team access. Share opens your device's share sheet; you pick the recipient and send.</div><h3>Corrections & old workers</h3><p class="muted small" style="margin-top:8px">Edit or delete incorrect entries with confirmation. Archive an inactive worker to stop new attendance without losing history. A rate change applies only to new dates, never past saved work.</p><p class="muted small" style="margin-top:20px">KaamLedger v1.1 · ₹0 running services · Browser-local ledger<br>${loadError?'Stored data could not be read. Restore a backup or reset explicitly.':storageOkay?'Storage is available.':'Storage failed; back up now.'}</p></div></div>`}
function openModal(html){let m=document.getElementById('modal');m.innerHTML=html;m.showModal();m.querySelector('[data-close]')?.addEventListener('click',()=>m.close())}function modalHead(t){return `<div class="modalhead"><h2>${t}</h2><button type="button" data-close aria-label="Close dialog">×</button></div>`}

let theme;try{theme=localStorage.getItem('kaamledger.theme')}catch{}if(theme==='light')document.body.classList.add('light');function updateTheme(){document.getElementById('themeBtn').textContent=document.body.classList.contains('light')?'☾ Dark':'☀ Light'}document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('light');try{localStorage.setItem('kaamledger.theme',document.body.classList.contains('light')?'light':'dark')}catch{}updateTheme()};updateTheme();render();window.addEventListener('beforeunload',e=>{if(Object.keys(draft).length){e.preventDefault();e.returnValue=''}});
</script><style id="simple-ui">

<script id="simple-ui-js">
(function(){

function keep(fn){let m=document.querySelector('main'),y=window.scrollY,t=m?m.scrollTop:0;fn();window.scrollTo(0,y);if(m)m.scrollTop=t}
markNow=function(id,v,date){let w=worker(id);if(!w)return;if(v==='unmark'&&!confirm(w.name+' ki is din ki attendance clear karein? Uska wage balance se hat jayega.'))return;if(!validDate(date)||date>today()){toast('Aaj se aage ki tareekh nahi chalegi.');return}let ok=change(s=>{let i=s.attendance.findIndex(a=>a.worker===id&&a.date===date);if(v==='unmark'){if(i>=0)s.attendance.splice(i,1);return}if(i>=0)s.attendance[i].units=v;else s.attendance.push({id:uid(),worker:id,date,units:v,rate:s.workers.find(x=>x.id===id).rate})});if(ok){moreFor='';keep(render);let d=date===today()?'':' ('+dateLabel(date)+')';toast(v==='unmark'?w.name+' ki attendance clear ki'+d:w.name+' ko '+lab(v)+' mark kiya ✓'+d)}};
function rowHTML(w,date){let saved=state.attendance.find(a=>a.worker===w.id&&a.date===date),u=saved?.units,rate=saved?.rate??w.rate,key=w.id+date,open=moreFor===key||u===1.5||u===2;

return `<div class="hz"><div class="who"><div class="avatar">${esc(w.name[0].toUpperCase())}</div><div><strong>${esc(w.name)}</strong><span class="muted small">${money(rate)} / din</span></div><div class="st ${u===undefined?'muted':u===0?'red':'green'}">${u===undefined?'Not marked':lab(u)+(u?'<br><span class="small">'+money(Math.round(rate*u))+'</span>':'')}</div></div><div class="btns">${b(1,'✓ Full')}${b(.5,'½ Half')}${b(0,'✗ Absent')}<button data-more="${w.id}" data-date="${date}" aria-expanded="${open}">${open?'▲':'⋯'}<small>more</small></button></div>${open?`<div class="btns extra">${b(1.5,'1.5 day')}${b(2,'Double')}<button data-mark="${w.id}" data-date="${date}" data-units="unmark" ${u===undefined?'disabled':''}>Clear</button></div>`:''}</div>`}
home=function(){let act=state.workers.filter(w=>!w.archived),all=tally(),cm=today().slice(0,7),[f,t]=monthRange(cm),m=tally('',f,t),d=today();
let pend=state.workers.map(w=>({w,s:tally(w.id)})).filter(x=>x.s.balance!==0).sort((a,b)=>b.s.balance-a.s.balance);
let h=`<div class="greet"><h1>Hello 👋</h1><p class="muted">${dateLabel(d)} · ${demo?'Demo mode':'Aaj ki attendance lagao'}</p></div>`;
if(!act.length)return h+`<div class="card">${empty('Pehle worker add karo','Naam aur daily rate daalo. Bas itna hi.',`<button class="primary" data-action="add-worker">+ Naya worker</button>`)}</div><div class="note">Pehle try karna hai? <button class="quiet" data-action="demo">Demo try karo</button> Demo aapke real data se alag rehta hai.</div>`;

overview=home;
attendance=function(){let list=state.workers.filter(w=>!w.archived&&[w.name,w.phone].join(' ').toLowerCase().includes(query.toLowerCase())),n=state.workers.filter(w=>!w.archived).length,y=new Date();y.setDate(y.getDate()-1);let yd=`${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
return `<div class="pagehead"><div><h1>Attendance lagao</h1><p class="muted">${attDate===today()?'Aaj':dateLabel(attDate)} ki attendance · ${list.length} worker</p></div></div><div class="datebar"><div><label for="attDate">Kis din ki attendance?</label><input id="attDate" type="date" value="${attDate}" max="${today()}"></div><button data-attday="${today()}" class="${attDate===today()?'primary':''}">Aaj</button><button data-attday="${yd}" class="${attDate===yd?'primary':''}">Kal</button></div>${n>6?`<div class="toolbar"><div><input id="search" placeholder="Name se search karo" value="${esc(query)}"></div></div>`:''}<div class="card">${list.length?list.map(w=>rowHTML(w,attDate)).join(''):empty('Koi worker nahi','Pehle worker add karo.',`<button class="primary" data-action="add-worker">+ Naya worker</button>`)}</div><p class="muted small" style="margin-top:12px">Galti hui? Dusra button dabao, balance apne aap badal jayega. "more" me 1.5 day, Double aur Clear hai.</p>`};
const opay=payments;payments=function(){let h=tr(opay());h=h.replace('<div class="toolbar">','<details class="filters"><summary>🔎 Filter (month / worker / type)</summary><div class="toolbar">').replace('</div></div><div class="two">','</div></div></details><div class="two">');return h};
